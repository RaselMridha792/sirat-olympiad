# Single-VPS stack. Only nginx publishes ports. Limits assume 8 vCPU / 32 GB — verify on the Hostinger plan page.
# Always run from the repo root WITH the root .env (compose reads .env from infra/ otherwise):
#   docker compose --env-file .env -f infra/docker-compose.yml up -d --build
# Local machine: add `-f infra/docker-compose.dev.yml` (see docs/RUNBOOK.md).
name: sirat
x-restart: &restart
  restart: unless-stopped
# Rotate container logs so they can never fill the disk that holds pgdata (RULEBOOK §11).
x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: '50m', max-file: '5' }

services:
  nginx:
    <<: [*restart, *logging]
    image: nginx:1.30.6-alpine # pinned stable; `server ... resolve` needs >= 1.27.3. Bump outside exam freeze windows
    # The whole infra/nginx folder is mounted, never single files: `nginx -s reload` then sees what git replaced.
    command: ['nginx', '-c', '/etc/nginx/sirat/nginx.conf', '-g', 'daemon off;']
    # IPv4 only: an IPv6 listener would make Docker's proxy replace the client address (RUNBOOK section 10).
    ports: ['0.0.0.0:80:80', '0.0.0.0:443:443']
    environment:
      APP_URL: ${APP_URL:-} # the TLS site takes its host name from it (entrypoint/15-public-host.envsh)
      NGINX_ENVSUBST_FILTER: PUBLIC_HOST # nothing else in the template is substituted
    volumes:
      - ./nginx:/etc/nginx/sirat:ro
      # Production site, rendered at start into /etc/nginx/conf.d/site.conf. The dev override mounts sites/plain here.
      - ./nginx/sites/tls:/etc/nginx/templates:ro
      - ./nginx/entrypoint/15-public-host.envsh:/docker-entrypoint.d/15-public-host.envsh:ro
    depends_on: [web, api]
    healthcheck:
      # 127.0.0.1, not localhost: in these images localhost resolves to ::1 and the services listen on IPv4.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/healthz']
      interval: 15s
    deploy: { resources: { limits: { cpus: '1', memory: 512M } } }

  web:
    <<: [*restart, *logging]
    build: { context: .., dockerfile: apps/web/Dockerfile }
    # No env_file: the Next.js standalone server needs no secrets (PORT/HOSTNAME come from the image).
    environment:
      # Server-side session lookups (GET /api/auth/me) go straight to the API inside the stack, not via nginx.
      API_INTERNAL_URL: http://api:4000
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/']
      interval: 15s
    deploy: { resources: { limits: { cpus: '1', memory: 1G } } }

  # One-shot: `prisma migrate deploy`, the runtime role (prisma/runtime-role.ts) and the idempotent config seed, then
  # exits. The API starts only after it succeeds. Runs on every `up`; the three steps are safe to repeat (the seed never
  # overwrites admin-edited values).
  migrate:
    <<: *logging
    build: { context: .., dockerfile: apps/api/Dockerfile, target: migrate }
    # Only what `prisma migrate deploy` (DIRECT_URL), the runtime role (DIRECT_URL, POSTGRES_APP_PASSWORD) and the
    # config seed (DATABASE_URL) read; not the whole .env. POSTGRES_APP_PASSWORD stays optional until L8 switches the API
    # to sirat_app (empty: the password step is skipped).
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL missing - run compose with --env-file .env}
      DIRECT_URL: ${DIRECT_URL:?DIRECT_URL missing - run compose with --env-file .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-}
    restart: 'no'
    depends_on:
      pgbouncer: { condition: service_healthy }
    deploy: { resources: { limits: { cpus: '1', memory: 1G } } }

  api:
    <<: [*restart, *logging]
    build: { context: .., dockerfile: apps/api/Dockerfile, target: runtime }
    env_file: ../.env
    environment:
      NODE_ENV: production # beats env_file: a NODE_ENV=development left in .env cannot downgrade the API
    # Longer than nginx proxy_read_timeout (30 s): SIGTERM lets in-flight requests finish before pools close.
    stop_grace_period: 35s
    deploy:
      replicas: 4
      resources: { limits: { cpus: '1', memory: 1G } }
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:4000/api/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 15s
    depends_on:
      migrate: { condition: service_completed_successfully }
      pgbouncer: { condition: service_healthy }
      redis-cache: { condition: service_healthy }
      redis-queue: { condition: service_healthy }

  # Queue workers (email today): the API image with the worker entrypoint, so job load never slows the API.
  # No published port; the health endpoint (WORKER_HEALTH_PORT, default 4001) is only for this healthcheck.
  worker:
    <<: [*restart, *logging]
    build: { context: .., dockerfile: apps/api/Dockerfile, target: runtime }
    command: ['node', 'dist/worker.js']
    env_file: ../.env
    environment:
      NODE_ENV: production
    # Jobs in progress finish on SIGTERM (an email send gives up after 10 s).
    stop_grace_period: 35s
    deploy:
      replicas: 1
      resources: { limits: { cpus: '1', memory: 512M } }
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:4001/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 15s
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis-queue: { condition: service_healthy }

  pgbouncer:
    <<: [*restart, *logging]
    image: edoburu/pgbouncer:v1.25.2-p0 # pinned; bump deliberately outside exam freeze windows
    environment:
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USER: ${POSTGRES_USER:?POSTGRES_USER missing - run compose with --env-file .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing - run compose with --env-file .env}
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB missing - run compose with --env-file .env}
      LISTEN_PORT: '6432' # must match DATABASE_URL (image default is 5432)
      POOL_MODE: transaction
      MAX_CLIENT_CONN: '2000'
      DEFAULT_POOL_SIZE: '40'
      AUTH_TYPE: scram-sha-256
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 6432']
      interval: 10s
    depends_on:
      postgres: { condition: service_healthy }
    deploy: { resources: { limits: { cpus: '0.5', memory: 256M } } }

  postgres:
    <<: [*restart, *logging]
    image: postgres:17-alpine
    shm_size: 1g # Docker's 64 MB default /dev/shm breaks parallel queries
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER missing - run compose with --env-file .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing - run compose with --env-file .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB missing - run compose with --env-file .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: ['postgres', '-c', 'config_file=/etc/postgresql/postgresql.conf']
    healthcheck:
      # $$ = read the container's own env at runtime, not compose interpolation
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
    deploy: { resources: { limits: { cpus: '3', memory: 12G } } }

  redis-cache:
    <<: [*restart, *logging]
    image: redis:7-alpine
    command: ['redis-server', '/usr/local/etc/redis/redis-cache.conf']
    volumes: ['./redis/redis-cache.conf:/usr/local/etc/redis/redis-cache.conf:ro']
    healthcheck: { test: ['CMD', 'redis-cli', 'ping'], interval: 10s }
    deploy: { resources: { limits: { cpus: '0.5', memory: 2G } } }

  redis-queue:
    <<: [*restart, *logging]
    image: redis:7-alpine
    command: ['redis-server', '/usr/local/etc/redis/redis-queue.conf']
    volumes:
      - ./redis/redis-queue.conf:/usr/local/etc/redis/redis-queue.conf:ro
      - redisqueue:/data
    healthcheck: { test: ['CMD', 'redis-cli', 'ping'], interval: 10s }
    deploy: { resources: { limits: { cpus: '0.5', memory: 1G } } }

volumes:
  pgdata:
  redisqueue:
