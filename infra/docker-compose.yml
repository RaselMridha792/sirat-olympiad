# Single-VPS stack. Only nginx publishes ports. Limits assume 8 vCPU / 32 GB — verify on the Hostinger plan page.
name: sirat
x-restart: &restart
  restart: unless-stopped

services:
  nginx:
    <<: *restart
    image: nginx:1.27-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_params_inline:/etc/nginx/proxy_params_inline:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on: [web, api]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 15s
    deploy: { resources: { limits: { cpus: "1", memory: 512M } } }

  web:
    <<: *restart
    build: { context: .., dockerfile: apps/web/Dockerfile }
    env_file: ../.env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 15s
    deploy: { resources: { limits: { cpus: "1", memory: 1G } } }

  api:
    <<: *restart
    build: { context: .., dockerfile: apps/api/Dockerfile }
    env_file: ../.env
    deploy:
      replicas: 4
      resources: { limits: { cpus: "1", memory: 1G } }
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis-cache: { condition: service_healthy }
      redis-queue: { condition: service_healthy }

  pgbouncer:
    <<: *restart
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "2000"
      DEFAULT_POOL_SIZE: "40"
      AUTH_TYPE: scram-sha-256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
      interval: 10s
    depends_on:
      postgres: { condition: service_healthy }
    deploy: { resources: { limits: { cpus: "0.5", memory: 256M } } }

  postgres:
    <<: *restart
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
    deploy: { resources: { limits: { cpus: "3", memory: 12G } } }

  redis-cache:
    <<: *restart
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis-cache.conf"]
    volumes: ["./redis/redis-cache.conf:/usr/local/etc/redis/redis-cache.conf:ro"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s }
    deploy: { resources: { limits: { cpus: "0.5", memory: 2G } } }

  redis-queue:
    <<: *restart
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis-queue.conf"]
    volumes:
      - ./redis/redis-queue.conf:/usr/local/etc/redis/redis-queue.conf:ro
      - redisqueue:/data
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s }
    deploy: { resources: { limits: { cpus: "0.5", memory: 1G } } }

volumes:
  pgdata:
  redisqueue:
