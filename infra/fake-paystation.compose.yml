# DEV/TEST ONLY: the fake PayStation for load and staging stacks (PAYMENTS-PLAN D5, 8.1). NEVER on the production
# project. An overlay on the main file; exam's load overlay (loadtests/exam-load.compose.yml) stacks on top:
#   docker compose --env-file .env -f infra/docker-compose.yml -f infra/fake-paystation.compose.yml [-f …] up -d --build
# It adds `fake-paystation` (internal port 18090 only, nothing published) and points the api and the worker at it.
# Environment beats env_file, so real PayStation credentials in .env are never used by this stack.
services:
  fake-paystation:
    build: { context: ../apps/api/test/fake-paystation }
    image: sirat-fake-paystation:${SIRAT_TAG:-latest}
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: 10m, max-file: '3' } }
    environment:
      FAKE_PAYSTATION_HOST: 0.0.0.0
      FAKE_PAYSTATION_PORT: '18090'
      # The base of its checkout links: what the payer (k6 inside this project) reaches it by.
      FAKE_PAYSTATION_PUBLIC_URL: ${FAKE_PAYSTATION_PUBLIC_URL:-http://fake-paystation:18090}
      # Pay posts the IPN straight to the api service (any replica), as PayStation would to our server.
      FAKE_PAYSTATION_IPN_URL: http://api:4000/api/payments/paystation/ipn
    expose: ['18090']
    read_only: true
    deploy: { resources: { limits: { cpus: '0.5', memory: 256M } } }
    # The image's own healthcheck: GET /__fake/health.

  api:
    environment: &fake-paystation-env
      # The API refuses PAYSTATION_ENV=fake under NODE_ENV=production (a money safeguard: a fake gateway can never be
      # reached by the real site). This stack runs api and worker as `development`, which in the API only means debug
      # logs (LOG_LEVEL pins info), no https or Secure-cookie check, and no superuser check. Same code and image.
      NODE_ENV: development
      LOG_LEVEL: info
      PAYSTATION_ENV: fake
      PAYSTATION_BASE_URL: http://fake-paystation:18090
      PAYSTATION_MERCHANT_ID: fake-merchant
      PAYSTATION_PASSWORD: fake-password-not-a-secret
      PAYSTATION_ACCOUNT_LABEL: load-fake
      PAYSTATION_INVOICE_PREFIX: L
      PAYSTATION_PAY_WITH_CHARGE: '0'
      # Where the fake sends the payer back (a browser redirect: k6 follows it inside this project).
      PAYSTATION_CALLBACK_URL: ${FAKE_PAYSTATION_CALLBACK_BASE:-http://nginx}/api/payments/paystation/callback
      PAYSTATION_IPN_URL: http://api:4000/api/payments/paystation/ipn
    depends_on:
      fake-paystation: { condition: service_healthy }

  worker:
    environment: *fake-paystation-env
    depends_on:
      fake-paystation: { condition: service_healthy }
