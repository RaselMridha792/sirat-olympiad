# Starting values for 32 GB RAM host (tune with load tests). See docs/RULEBOOK.md section 6.
listen_addresses = '*'
shared_buffers = 8GB
effective_cache_size = 20GB
maintenance_work_mem = 1GB
work_mem = 16MB
max_connections = 200
wal_compression = on
checkpoint_completion_target = 0.9
random_page_cost = 1.1
log_min_duration_statement = 500
password_encryption = scram-sha-256
