# Nginx: only public service. Cloudflare in front. Compression happens HERE, never in Node.
worker_processes auto;
events { worker_connections 4096; }

http {
  include /etc/nginx/mime.types;
  sendfile on;
  server_tokens off;

  # Restore the real client IP from Cloudflare (rate limits + logs). Trusted peers = Cloudflare ranges only.
  include /etc/nginx/cloudflare-realip.conf;

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_types text/css application/javascript application/json text/plain image/svg+xml;

  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
  limit_req_zone $binary_remote_addr zone=api:20m rate=30r/s;
  limit_req_status 429; # default would be 503, which looks like an outage to clients and monitors

  # Re-resolve service names through Docker DNS so restarted/scaled replicas (new IPs) are picked up
  # without restarting nginx. `server ... resolve` needs nginx >= 1.27.3 and a shared `zone`.
  # max_fails=0: with a shared zone, one slow request must not take a replica out of rotation for every client
  # (the default max_fails=1 + timeouts did exactly that). Retries are limited in proxy_params_inline.
  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream web_up { zone web_up 64k; server web:3000 resolve max_fails=0; keepalive 32; }
  upstream api_up { zone api_up 64k; server api:4000 resolve max_fails=0; keepalive 64; }   # all api replicas

  server {
    listen 80;
    server_name _;
    # TODO: add listen 443 ssl http2 + certs + HSTS once the domain/Cloudflare is decided.
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # TODO: Content-Security-Policy tuned for the app; Strict-Transport-Security on HTTPS.

    location = /healthz { return 200 "ok"; }

    location /api/auth/ {
      limit_req zone=auth burst=20 nodelay;
      # Errors produced by nginx itself (rate limit, no upstream, timeout) use the API JSON error shape.
      error_page 429 @api_429;
      error_page 502 @api_502;
      error_page 503 @api_503;
      error_page 504 @api_504;
      proxy_pass http://api_up;
      include /etc/nginx/proxy_params_inline;
    }
    location /api/ {
      limit_req zone=api burst=60 nodelay;
      # Errors produced by nginx itself (rate limit, no upstream, timeout) use the API JSON error shape.
      error_page 429 @api_429;
      error_page 502 @api_502;
      error_page 503 @api_503;
      error_page 504 @api_504;
      proxy_pass http://api_up;
      include /etc/nginx/proxy_params_inline;
    }
    # `return` needs a literal status code, hence one named location per code.
    location @api_429 {
      default_type application/json;
      add_header Retry-After 1 always;
      add_header X-Content-Type-Options nosniff always;
      return 429 '{"statusCode":429,"code":"TOO_MANY_REQUESTS","message":"Too many requests, please retry shortly"}';
    }
    location @api_502 {
      default_type application/json;
      add_header X-Content-Type-Options nosniff always;
      return 502 '{"statusCode":502,"code":"BAD_GATEWAY","message":"Service temporarily unavailable"}';
    }
    location @api_503 {
      default_type application/json;
      add_header X-Content-Type-Options nosniff always;
      return 503 '{"statusCode":503,"code":"SERVICE_UNAVAILABLE","message":"Service temporarily unavailable"}';
    }
    location @api_504 {
      default_type application/json;
      add_header X-Content-Type-Options nosniff always;
      return 504 '{"statusCode":504,"code":"GATEWAY_TIMEOUT","message":"Service temporarily unavailable"}';
    }
    location /_next/static/ {
      # Next already sends `Cache-Control: public, max-age=31536000, immutable` for hashed assets.
      # The include keeps upstream keepalive (HTTP/1.1) and the server-level security headers are inherited.
      proxy_pass http://web_up;
      include /etc/nginx/proxy_params_inline;
    }
    location / {
      proxy_pass http://web_up;
      include /etc/nginx/proxy_params_inline;
    }
  }
}
