# Nginx: only public service. Cloudflare in front. Compression happens HERE, never in Node.
worker_processes auto;
events { worker_connections 4096; }

http {
  include /etc/nginx/mime.types;
  sendfile on;
  server_tokens off;

  # Restore real client IP from Cloudflare (IMPORTANT for rate limits + logs).
  # TODO: add the full Cloudflare IP list (https://www.cloudflare.com/ips/) as set_real_ip_from lines.
  real_ip_header CF-Connecting-IP;

  gzip on;
  gzip_comp_level 5;
  gzip_types text/css application/javascript application/json text/plain image/svg+xml;

  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
  limit_req_zone $binary_remote_addr zone=api:20m rate=30r/s;

  # Re-resolve service names through Docker DNS so restarted/scaled replicas (new IPs) are picked up
  # without restarting nginx. `server ... resolve` needs nginx >= 1.27.3 and a shared `zone`.
  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream web_up { zone web_up 64k; server web:3000 resolve; keepalive 32; }
  upstream api_up { zone api_up 64k; server api:4000 resolve; keepalive 64; }   # all api replicas

  server {
    listen 80;
    server_name _;
    # TODO: add listen 443 ssl http2 + certs + HSTS once the domain/Cloudflare is decided.
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # TODO: Content-Security-Policy tuned for the app; Strict-Transport-Security on HTTPS.

    location = /healthz { return 200 "ok"; }

    location /api/auth/ {
      limit_req zone=auth burst=20 nodelay;
      proxy_pass http://api_up;
      include /etc/nginx/proxy_params_inline;
    }
    location /api/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://api_up;
      include /etc/nginx/proxy_params_inline;
    }
    location /_next/static/ {
      proxy_pass http://web_up;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
      proxy_pass http://web_up;
      include /etc/nginx/proxy_params_inline;
    }
  }
}
