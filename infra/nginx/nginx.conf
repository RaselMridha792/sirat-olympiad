# Nginx: only public service. Cloudflare in front. Compression happens HERE, never in Node.
# Compose mounts the whole infra/nginx folder at /etc/nginx/sirat and starts `nginx -c /etc/nginx/sirat/nginx.conf`.
# A folder mount, not single files: `nginx -s reload` sees files that git or a script replaced. The public site is
# rendered at container start from sites/tls (production) or sites/plain (dev and CI) into /etc/nginx/conf.d/site.conf
# (DECISIONS "TLS behind Cloudflare").
worker_processes auto;
pid /run/nginx.pid;
# Process-level problems only (a worker that died, startup errors). Requests log at `emerg` (inside http below).
error_log /var/log/nginx/error.log crit;
events { worker_connections 4096; }

http {
  # nginx appends the whole request line and the referrer to every error line written for a request, at any level:
  # a full temp disk (crit), running out of connections or descriptors (alert). Search terms must never reach a log,
  # so request-level errors log only at `emerg`. The access log carries the status, the upstream status and the times;
  # the host monitor watches disk and connections (LAUNCH-PLAN section 6).
  error_log /var/log/nginx/error.log emerg;
  include /etc/nginx/mime.types;
  sendfile on;
  server_tokens off;
  client_max_body_size 1m;

  # Restore the real client IP from Cloudflare (rate limits + logs). Trusted peers = Cloudflare's ranges, plus, only
  # while a k6 run needs them, the load-test generators in the git-ignored file that scripts/loadtest-generators.sh
  # writes (RUNBOOK section 10). A wildcard: with no such file it matches nothing, and no generator is trusted.
  include /etc/nginx/sirat/cloudflare-realip.conf;
  include /etc/nginx/sirat/loadtest-realip*.conf;

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_types text/css application/javascript application/json text/plain image/svg+xml text/x-component;

  # The rate-limit key: one bucket per IPv4 address, one per IPv6 /64 (one client can hold a whole /64: a home line, a
  # phone), keyed by its first four groups as text. $remote_addr is the restored client address, and nginx prints IPv6
  # in canonical form: lowercase, no leading zeros, the longest run of two or more zero groups (the first, on a tie)
  # written as "::". So there is one pattern per place "::" can stand, and the zero groups it hides among the first four
  # are written out. IPv4 keeps $binary_remote_addr (4 bytes), and so does an IPv6 address with an IPv4 tail
  # (::ffff:a.b.c.d, 16 bytes; Cloudflare sends IPv4 clients as plain IPv4): one bucket per address, never equal to a
  # text key. The listeners are IPv4 only, but CF-Connecting-IP may carry IPv6. infra/nginx/test/check-real-ips.sh runs
  # every pattern through nginx.
  map $remote_addr $sirat_limit_key {
    # No "::": a:b:c:d:e:f:g:h
    "~^(?<sirat_k8>[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}):[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}$" "${sirat_k8}";
    # "::" after 4 to 6 groups: a:b:c:d::, a:b:c:d::g:h, a:b:c:d:e::h, a:b:c:d:e:f::
    "~^(?<sirat_k4>[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}):(?:[0-9a-f]{1,4}:){0,2}:(?:[0-9a-f]{1,4}(?::[0-9a-f]{1,4}){0,2})?$" "${sirat_k4}";
    # "::" after 3 groups hides the fourth: a:b:c::, a:b:c::f:g:h
    "~^(?<sirat_k3>[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4})::(?:[0-9a-f]{1,4}(?::[0-9a-f]{1,4}){0,2})?$" "${sirat_k3}:0";
    # "::" after 2 groups hides the third and the fourth: a:b::, a:b::e:f:g:h
    "~^(?<sirat_k2>[0-9a-f]{1,4}:[0-9a-f]{1,4})::(?:[0-9a-f]{1,4}(?::[0-9a-f]{1,4}){0,3})?$" "${sirat_k2}:0:0";
    # "::" after 1 group: two zero groups when five groups follow (a::d:e:f:g:h), three or more otherwise
    "~^(?<sirat_k1>[0-9a-f]{1,4})::(?<sirat_k1d>[0-9a-f]{1,4})(?::[0-9a-f]{1,4}){4}$" "${sirat_k1}:0:0:${sirat_k1d}";
    "~^(?<sirat_k1z>[0-9a-f]{1,4})::(?:[0-9a-f]{1,4}(?::[0-9a-f]{1,4}){0,3})?$" "${sirat_k1z}:0:0:0";
    # Leading "::": two zero groups when six groups follow (::c:d:e:f:g:h), three when five follow, four or more otherwise
    "~^::(?<sirat_k0c>[0-9a-f]{1,4}:[0-9a-f]{1,4})(?::[0-9a-f]{1,4}){4}$" "0:0:${sirat_k0c}";
    "~^::(?<sirat_k0d>[0-9a-f]{1,4})(?::[0-9a-f]{1,4}){4}$" "0:0:0:${sirat_k0d}";
    "~^::(?:[0-9a-f]{1,4}(?::[0-9a-f]{1,4}){0,3})?$" "0:0:0:0";
    default $binary_remote_addr;
  }

  # Flood guards per client ($sirat_limit_key), sized for a school lab or a mobile operator's carrier-grade NAT behind
  # one address (L4, DECISIONS "Per-user API limits"). The precise limits are the API's: per signed-in user, and the
  # login limits count failed logins only (owner, 2026-10-31). `auth` covers the credential and email-link endpoints,
  # `api` every other /api call (the registration poll included); the bursts (1,000 and 2,000, nodelay) are in
  # app-locations.conf. No per-IP limit_conn: it would refuse a school.
  limit_req_zone $sirat_limit_key zone=auth:10m rate=100r/s;
  limit_req_zone $sirat_limit_key zone=api:20m rate=200r/s;
  limit_req_status 429; # default would be 503, which looks like an outage to clients and monitors

  # Access log without query strings and without the Referer (lead, 2026-10-31): an admin's search
  # (/admin/users?q=<name or phone>) must never reach a log, and a browser sends that page's full URL as the Referer
  # of its next requests. The path is cut at the first `?`. edge= is the Cloudflare address the request came from;
  # urt and us are quoted because a retried request lists several values ("0.002, 0.004").
  map $request_uri $sirat_log_path {
    "~^(?<sirat_path>[^?]*)" $sirat_path;
  }
  map $request_uri $sirat_loggable {
    /healthz 0;
    default 1;
  }
  log_format sirat '$time_iso8601 $remote_addr edge=$realip_remote_addr "$request_method $sirat_log_path $server_protocol" '
                   '$status $body_bytes_sent rt=$request_time urt="$upstream_response_time" us="$upstream_status" '
                   'rid=$request_id "$http_user_agent"';
  access_log /var/log/nginx/access.log sirat if=$sirat_loggable;

  # HSTS only on https responses (an empty value sends no header). nginx is the only source: the API's helmet has it
  # off. 300 s at launch, raised after stable weeks, no includeSubDomains (LAUNCH-PLAN section 3, owner question Q3).
  map $https $sirat_hsts {
    on "max-age=300";
    default "";
  }

  # Maintenance switch (L5, maintenance.conf in the public servers): what a request gets while the flag file exists.
  # /healthz and the PayStation IPN and callback pass: the IPN only records and queues (PayStation retries it, and
  # reconciliation catches anything missed), and the callback only records the return and sends the student on to the
  # result page, which then shows the maintenance page. Other /api calls get the JSON answer, everything else the page.
  # The raw request line, not $uri: a request passes only when the path it sent is exactly one of these, so dot segments,
  # encodings or double slashes that nginx would normalise into them (and then send upstream as sent) get the
  # maintenance answer. The callback takes one plain segment (the invoice). Regexes only, because map compares plain
  # strings without regard to case (/API/... would pass and reach the web).
  map $request_uri $sirat_maintenance_answer {
    default page;
    ~^/healthz(\?|$) pass;
    ~^/api/payments/paystation/ipn(\?|$) pass;
    ~^/api/payments/paystation/callback/[A-Za-z0-9_-]+(\?|$) pass;
    ~^/api/ json;
  }

  # Re-resolve service names through Docker DNS so restarted/scaled replicas (new IPs) are picked up
  # without restarting nginx. `server ... resolve` needs nginx >= 1.27.3 and a shared `zone`.
  # max_fails=0: with a shared zone, one slow request must not take a replica out of rotation for every client
  # (the default max_fails=1 + timeouts did exactly that). Retries are limited in proxy_params_inline.
  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream web_up { zone web_up 64k; server web:3000 resolve max_fails=0; keepalive 32; }
  upstream api_up { zone api_up 64k; server api:4000 resolve max_fails=0; keepalive 64; }   # all api replicas

  # Checks from inside the container (the deploy smoke, maintenance, a restore): loopback only, never published,
  # no https redirect and no maintenance switch. `$DC exec -T nginx wget -qO- http://127.0.0.1:8081/api/ready`
  server {
    listen 127.0.0.1:8081;
    server_name _;
    include /etc/nginx/sirat/security-headers.conf;
    location = /healthz { return 200 "ok"; }
    include /etc/nginx/sirat/app-locations.conf;
  }

  # The public site, rendered by the image's entrypoint from the mounted templates folder.
  include /etc/nginx/conf.d/site.conf;
}
