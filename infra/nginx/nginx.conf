# Nginx: only public service. Cloudflare in front. Compression happens HERE, never in Node.
# Compose mounts the whole infra/nginx folder at /etc/nginx/sirat and starts `nginx -c /etc/nginx/sirat/nginx.conf`.
# A folder mount, not single files: `nginx -s reload` sees files that git or a script replaced. The public site is
# rendered at container start from sites/tls (production) or sites/plain (dev and CI) into /etc/nginx/conf.d/site.conf
# (DECISIONS "TLS behind Cloudflare").
worker_processes auto;
pid /run/nginx.pid;
# Process-level problems only (a worker that died, startup errors). Requests log at `emerg` (inside http below).
error_log /var/log/nginx/error.log crit;
events { worker_connections 4096; }

http {
  # nginx appends the whole request line and the referrer to every error line written for a request, at any level:
  # a full temp disk (crit), running out of connections or descriptors (alert). Search terms must never reach a log,
  # so request-level errors log only at `emerg`. The access log carries the status, the upstream status and the times;
  # the host monitor watches disk and connections (LAUNCH-PLAN section 6).
  error_log /var/log/nginx/error.log emerg;
  include /etc/nginx/mime.types;
  sendfile on;
  server_tokens off;
  client_max_body_size 1m;

  # Restore the real client IP from Cloudflare (rate limits + logs). Trusted peers = Cloudflare ranges only.
  include /etc/nginx/sirat/cloudflare-realip.conf;

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_types text/css application/javascript application/json text/plain image/svg+xml;

  # Credential endpoints: only a flood guard, sized for a whole school behind one IP logging in at exam start.
  # The real limits live in the API and count failed logins only (owner, 2026-10-31).
  limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=api:20m rate=30r/s;
  limit_req_status 429; # default would be 503, which looks like an outage to clients and monitors

  # Access log without query strings and without the Referer (lead, 2026-10-31): an admin's search
  # (/admin/users?q=<name or phone>) must never reach a log, and a browser sends that page's full URL as the Referer
  # of its next requests. The path is cut at the first `?`. edge= is the Cloudflare address the request came from;
  # urt and us are quoted because a retried request lists several values ("0.002, 0.004").
  map $request_uri $sirat_log_path {
    "~^(?<sirat_path>[^?]*)" $sirat_path;
  }
  map $request_uri $sirat_loggable {
    /healthz 0;
    default 1;
  }
  log_format sirat '$time_iso8601 $remote_addr edge=$realip_remote_addr "$request_method $sirat_log_path $server_protocol" '
                   '$status $body_bytes_sent rt=$request_time urt="$upstream_response_time" us="$upstream_status" '
                   'rid=$request_id "$http_user_agent"';
  access_log /var/log/nginx/access.log sirat if=$sirat_loggable;

  # HSTS only on https responses (an empty value sends no header). nginx is the only source: the API's helmet has it
  # off. 300 s at launch, raised after stable weeks, no includeSubDomains (LAUNCH-PLAN section 3, owner question Q3).
  map $https $sirat_hsts {
    on "max-age=300";
    default "";
  }

  # Maintenance switch (L5, maintenance.conf in the public servers): what a request gets while the flag file exists.
  # /healthz and the PayStation IPN and callback pass: the IPN only records and queues (PayStation retries it, and
  # reconciliation catches anything missed), and the callback only records the return and sends the student on to the
  # result page, which then shows the maintenance page. Other /api calls get the JSON answer, everything else the page.
  # Exact paths: $uri is already decoded and normalised, and the callback takes a single segment (the invoice). All
  # regexes, because map compares plain strings without regard to case (/API/... would pass and reach the web).
  map $uri $sirat_maintenance_answer {
    default page;
    ~^/healthz$ pass;
    ~^/api/payments/paystation/ipn$ pass;
    ~^/api/payments/paystation/callback/[^/]+$ pass;
    ~^/api/ json;
  }

  # Re-resolve service names through Docker DNS so restarted/scaled replicas (new IPs) are picked up
  # without restarting nginx. `server ... resolve` needs nginx >= 1.27.3 and a shared `zone`.
  # max_fails=0: with a shared zone, one slow request must not take a replica out of rotation for every client
  # (the default max_fails=1 + timeouts did exactly that). Retries are limited in proxy_params_inline.
  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream web_up { zone web_up 64k; server web:3000 resolve max_fails=0; keepalive 32; }
  upstream api_up { zone api_up 64k; server api:4000 resolve max_fails=0; keepalive 64; }   # all api replicas

  # Checks from inside the container (the deploy smoke, maintenance, a restore): loopback only, never published,
  # no https redirect and no maintenance switch. `$DC exec -T nginx wget -qO- http://127.0.0.1:8081/api/ready`
  server {
    listen 127.0.0.1:8081;
    server_name _;
    include /etc/nginx/sirat/security-headers.conf;
    location = /healthz { return 200 "ok"; }
    include /etc/nginx/sirat/app-locations.conf;
  }

  # The public site, rendered by the image's entrypoint from the mounted templates folder.
  include /etc/nginx/conf.d/site.conf;
}
