# The application's locations, shared by every server (the public site in sites/ and the internal listener in
# nginx.conf). /healthz is defined by each server itself.

# Only the endpoints that take credentials or send email. /api/auth/me, refresh and logout run on every page
# and fall to /api/ below (a regex location wins over the /api/ prefix).
location ~ ^/api/auth/(login|forgot-password|reset-password|verify-email|resend-verification)$ {
  limit_req zone=auth burst=200 nodelay;
  include /etc/nginx/sirat/api-headers.conf;
  # Errors produced by nginx itself (rate limit, no upstream, timeout) use the API JSON error shape.
  error_page 429 @api_429;
  error_page 502 @api_502;
  error_page 503 @api_503;
  error_page 504 @api_504;
  proxy_pass http://api_up;
  include /etc/nginx/sirat/proxy_params_inline;
}
# The PayStation callback: a student's browser coming back from paying. The API records it and redirects to the result
# page; if the API cannot answer (a deploy gap, a restore), the student gets the maintenance page, which says the
# payment is safe, instead of a JSON error. It also passes the maintenance switch (nginx.conf).
location /api/payments/paystation/callback/ {
  limit_req zone=api burst=60 nodelay;
  include /etc/nginx/sirat/api-headers.conf;
  error_page 429 @api_429;
  error_page 502 503 504 /_sirat/maintenance.html;
  proxy_pass http://api_up;
  include /etc/nginx/sirat/proxy_params_inline;
}
location /api/ {
  limit_req zone=api burst=60 nodelay;
  include /etc/nginx/sirat/api-headers.conf;
  # Errors produced by nginx itself (rate limit, no upstream, timeout) use the API JSON error shape.
  error_page 429 @api_429;
  error_page 502 @api_502;
  error_page 503 @api_503;
  error_page 504 @api_504;
  proxy_pass http://api_up;
  include /etc/nginx/sirat/proxy_params_inline;
}
# `return` needs a literal status code, hence one named location per code. Each has its own add_header, which drops
# the server-level headers, so each includes them again.
location @api_429 {
  default_type application/json;
  add_header Retry-After 1 always;
  include /etc/nginx/sirat/security-headers.conf;
  return 429 '{"statusCode":429,"code":"TOO_MANY_REQUESTS","message":"Too many requests, please retry shortly"}';
}
location @api_502 {
  default_type application/json;
  include /etc/nginx/sirat/security-headers.conf;
  return 502 '{"statusCode":502,"code":"BAD_GATEWAY","message":"Service temporarily unavailable"}';
}
location @api_503 {
  default_type application/json;
  include /etc/nginx/sirat/security-headers.conf;
  return 503 '{"statusCode":503,"code":"SERVICE_UNAVAILABLE","message":"Service temporarily unavailable"}';
}
location @api_504 {
  default_type application/json;
  include /etc/nginx/sirat/security-headers.conf;
  return 504 '{"statusCode":504,"code":"GATEWAY_TIMEOUT","message":"Service temporarily unavailable"}';
}
# The maintenance answers (L5). The page: for pages while the switch is on (maintenance.conf), and in place of nginx's
# own 502/504 on pages and on the PayStation callback. It is reached only through error_page, which keeps the status
# and turns any method into GET, so a form POST gets the page too (a static file answers a POST with 405).
location = /_sirat/maintenance.html {
  internal;
  alias /etc/nginx/sirat/pages/maintenance.html;
  charset utf-8;
  add_header Cache-Control no-store always;
  add_header Retry-After 120 always;
  include /etc/nginx/sirat/security-headers.conf;
}
# The JSON for other /api calls while the switch is on, in the API's error shape.
location = /_sirat/maintenance.json {
  internal;
  default_type application/json;
  add_header Cache-Control no-store always;
  add_header Retry-After 120 always;
  include /etc/nginx/sirat/security-headers.conf;
  return 503 '{"statusCode":503,"code":"MAINTENANCE","message":"Under maintenance, please retry in a few minutes"}';
}
location /_next/static/ {
  # Next already sends `Cache-Control: public, max-age=31536000, immutable` for hashed assets.
  # The include keeps upstream keepalive (HTTP/1.1) and the server-level security headers are inherited.
  # The web restarting (a deploy gap): the maintenance page instead of nginx's bare error, with nginx's status.
  error_page 502 504 /_sirat/maintenance.html;
  proxy_pass http://web_up;
  include /etc/nginx/sirat/proxy_params_inline;
}
location / {
  error_page 502 504 /_sirat/maintenance.html;
  proxy_pass http://web_up;
  include /etc/nginx/sirat/proxy_params_inline;
}
