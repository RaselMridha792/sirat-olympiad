# Headers on API answers (the /api locations in app-locations.conf). The API's helmet already sends nosniff, a
# Referrer-Policy and its own CSP on every answer, so nginx adds only what helmet does not: HSTS (helmet's is off).
# An add_header here also stops the server-level security-headers.conf from being inherited, so each header appears
# once. nginx's own JSON errors (@api_*) come with no upstream headers and include security-headers.conf instead.
add_header Strict-Transport-Security $sirat_hsts always;
