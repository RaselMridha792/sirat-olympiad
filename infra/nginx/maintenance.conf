# Maintenance switch (L5, RUNBOOK section 4), server level, included by the public servers only (sites/tls,
# sites/plain), never by the internal listener in nginx.conf. While the flag file exists (`scripts/maintenance.sh on`),
# requests get a 503, except what the map $sirat_maintenance_answer in nginx.conf lets pass (/healthz, the PayStation
# IPN and callback). nginx looks for the file on every request, so switching needs no reload.
set $sirat_maintenance pass;
if (-f /etc/nginx/sirat/maintenance/on) {
  set $sirat_maintenance $sirat_maintenance_answer;
}
# error_page sends the page through an internal redirect, which runs these lines again with the same request line:
# the page itself always passes.
if ($uri = /_sirat/maintenance.html) {
  set $sirat_maintenance pass;
}
# Pages: the HTML page (app-locations.conf), by error_page so that any method gets it. Server level, so it also covers
# the locations without their own error_page (only /healthz, which never fails).
error_page 503 /_sirat/maintenance.html;
if ($sirat_maintenance = page) {
  return 503;
}
# Other /api calls: the JSON answer.
if ($sirat_maintenance = json) {
  rewrite ^ /_sirat/maintenance.json last;
}
