# Security headers on every response nginx sends. Included at server level and again inside every location that has
# its own add_header (an add_header in a location drops the server-level ones).
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# Empty on plain http, so only https responses carry it (nginx.conf).
add_header Strict-Transport-Security $sirat_hsts always;
# Page CSP (RULEBOOK section 11), enforced: payments' wizard e2e passes under it with no violation, from the wizard to
# the gateway's checkout and back (CI's docker job runs it on every PR; DECISIONS "The page CSP is enforced"). No
# nonces: they would make every Next page dynamic, so inline scripts need 'unsafe-inline' for now. A violation in
# production: rename this header to Content-Security-Policy-Report-Only and reload nginx (RUNBOOK section 7).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
