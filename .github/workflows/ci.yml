# CI checks (RULEBOOK §13, §15, §18). ADVISORY on main: a private repo on GitHub Free cannot enforce required
# checks or branch protection (docs/DECISIONS.md), so deploy only a commit whose CI run is green (RUNBOOK §2).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Every main commit gets a finished run (the deploy gate checks the exact commit); PR runs can be superseded.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Format, typecheck, lint, unit tests, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"; v6 requires pnpm 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Shell scripts are executable in git (Windows commits drop the bit)
        run: git ls-files -s -- '*.sh' | awk '$1 != "100755" { print; bad = 1 } END { exit bad }'
      - run: pnpm format:check
      - run: pnpm --filter @sirat/shared build
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Dependency audit (all deps, high and above; the migrate image runs dev dependencies)
        run: pnpm audit --audit-level high

  database:
    name: Migrations, drift check, DB + Redis integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sirat
          POSTGRES_PASSWORD: ci-only-password # throwaway CI container, not a secret
          POSTGRES_DB: sirat_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sirat -d sirat_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      # Email integration tests deliver to Mailpit (owner: Mailpit until the sending domain is verified).
      mailpit:
        image: axllent/mailpit:v1.32.0
        ports: ['8025:8025']
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://sirat:ci-only-password@localhost:5432/sirat_test
      DIRECT_URL: postgresql://sirat:ci-only-password@localhost:5432/sirat_test
      TEST_DATABASE_URL: postgresql://sirat:ci-only-password@localhost:5432/sirat_test
      SHADOW_DATABASE_URL: postgresql://sirat:ci-only-password@localhost:5432/sirat_shadow
      REDIS_CACHE_URL: redis://localhost:6379
      # The AppModule wiring tests boot the real app, which validates these at startup.
      # JWT_ACCESS_SECRET is generated per run (see the first step): the app refuses weak or placeholder secrets.
      REDIS_QUEUE_URL: redis://localhost:6379
      MAILPIT_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Random signing secret for this run
        run: echo "JWT_ACCESS_SECRET=$(openssl rand -base64 48 | tr -d '\n')" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sirat/shared build
      - run: pnpm db:generate
      - name: Create shadow database for the drift check
        run: PGPASSWORD=ci-only-password psql -h localhost -U sirat -d sirat_test -c "CREATE DATABASE sirat_shadow"
      - name: Migrations match schema.prisma (fails on drift)
        working-directory: apps/api
        run: >-
          pnpm exec prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url "$SHADOW_DATABASE_URL"
          --exit-code
      - name: Apply migrations to a fresh DB, then constraint/seed/rate-limit/app tests
        run: pnpm --filter @sirat/api test:int

  docker:
    name: Nginx config, full stack smoke test, image contents
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DCD: docker compose --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.dev.yml
    steps:
      - uses: actions/checkout@v7
      - name: Compose files are valid (example env plus a random signing secret)
        run: |
          cp .env.example .env
          sed -i "s|^JWT_ACCESS_SECRET=.*|JWT_ACCESS_SECRET=$(openssl rand -hex 32)|" .env
          $DCD config --quiet
      - name: Nginx config is valid on the pinned image
        run: |
          image=$(docker compose --env-file .env -f infra/docker-compose.yml config --images | grep '^nginx:')
          docker run --rm --network none \
            -v "$PWD/infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/infra/nginx/proxy_params_inline:/etc/nginx/proxy_params_inline:ro" \
            -v "$PWD/infra/nginx/cloudflare-realip.conf:/etc/nginx/cloudflare-realip.conf:ro" \
            "$image" nginx -t
      - name: Build and start the whole stack (dev override sizes Postgres for the runner)
        run: $DCD up -d --build
      - name: Every long-running service becomes healthy; migrate exits 0 after the seed
        run: |
          for _ in $(seq 1 60); do
            states=$($DCD ps --format '{{.Service}}={{.Health}}' | grep -v '^migrate=' | sort)
            echo "$states" | grep -q -v '=healthy$' || break
            sleep 5
          done
          echo "$states"
          if echo "$states" | grep -v '=healthy$'; then echo "::error::services not healthy"; exit 1; fi
          code=$(docker inspect -f '{{.State.ExitCode}}' "$($DCD ps -a -q migrate)")
          [ "$code" = 0 ] || { echo "::error::migrate exited $code"; exit 1; }
          $DCD logs migrate | grep -q 'config seed done' || { echo "::error::config seed did not run"; exit 1; }
      - name: Through nginx - readiness (DB + both Redis), liveness and the web app
        run: |
          curl -fsS http://127.0.0.1:8080/api/ready
          curl -fsS http://127.0.0.1:8080/api/health
          curl -fsS -o /dev/null http://127.0.0.1:8080/
      - name: Images contain no env files, keys, dumps, old project, tests or dev fixtures
        # Scan the app roots as root (non-root find exits 1 on unreadable dirs and `bash -e` aborts the step).
        # node_modules is skipped: some packages ship test certificates.
        run: |
          for img in sirat-api sirat-migrate sirat-web; do
            found=$(docker run --rm --user 0 --entrypoint sh "$img" -c '
              for d in /repo /app; do
                [ -d "$d" ] || continue
                find "$d" -path "*/node_modules" -prune -o \( -name ".env" -o -name ".env.*" -o -name ".envrc" \
                  -o -name "*.pem" -o -name "*.key" -o -name "*.dump" -o -name "zero-olympiad-*" \
                  -o -path "*/prisma/fixtures" -o -path "*/apps/api/test" -o -path "*/infra" -o -path "*/scripts" \
                  -o -path "*/backups" -o -path "*/nginx/certs" \) -print
              done')
            if [ -n "$found" ]; then echo "::error::$img contains forbidden files:"; echo "$found"; exit 1; fi
            echo "$img clean"
          done
      - name: Logs on failure
        if: failure()
        run: $DCD ps -a; $DCD logs --tail=200
      - name: Tear down
        if: always()
        run: $DCD down -v
