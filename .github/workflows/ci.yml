# CI checks (RULEBOOK §13, §15, §18). ADVISORY on main: a private repo on GitHub Free cannot enforce required
# checks or branch protection (docs/DECISIONS.md), so deploy only a commit whose CI run is green (RUNBOOK §2).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Every main commit gets a finished run (the deploy gate checks the exact commit); PR runs can be superseded.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Format, typecheck, lint, unit tests, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"; v6 requires pnpm 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Shell scripts are executable in git (Windows commits drop the bit)
        run: git ls-files -s -- '*.sh' | awk '$1 != "100755" { print; bad = 1 } END { exit bad }'
      - run: pnpm format:check
      - run: pnpm --filter @sirat/shared build
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Dependency audit (all deps, high and above; the migrate image runs dev dependencies)
        run: pnpm audit --audit-level high

  web-pages:
    # Render-level checks of every dashboard page with REAL sessions (apps/web/scripts/check-pages.mjs,
    # docs/07-UI-MIGRATION.md): the API runs here on :4000 with its own Postgres and Redis; a fixture student and an
    # admin made with the create-admin CLI log in through it. No session stub.
    name: Dashboard pages (real sessions, no student data leaks, polite states, API down)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://sirat:ci-only-password@localhost:5432/sirat_pages
      DIRECT_URL: postgresql://sirat:ci-only-password@localhost:5432/sirat_pages
      REDIS_CACHE_URL: redis://localhost:6379/0
      REDIS_QUEUE_URL: redis://localhost:6379/1
      COOKIE_SECURE: 'false' # plain http on localhost
      CHECK_API_URL: http://localhost:4000
      CHECK_STUDENT_EMAIL: student1@fixtures.invalid
      CHECK_ADMIN_EMAIL: pages-admin@ci.invalid
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sirat/shared build
      - run: pnpm db:generate
      - name: Throwaway secrets for this run (masked)
        run: |
          for name in JWT_ACCESS_SECRET FIXTURE_PASSWORD CHECK_ADMIN_PASSWORD; do
            value=$(openssl rand -hex 24)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
            # An if, not `[ ... ] && ...`: that list ends the loop, and so the step, with status 1.
            if [ "$name" = FIXTURE_PASSWORD ]; then echo "CHECK_STUDENT_PASSWORD=$value" >> "$GITHUB_ENV"; fi
          done
      - name: Postgres with the dev/test marker (fixtures refuse a server without it; services cannot pass -c)
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_USER=sirat -e POSTGRES_PASSWORD=ci-only-password \
            -e POSTGRES_DB=sirat_pages postgres:17-alpine -c sirat.environment=test
          # Over TCP: on first start the image runs a socket-only temporary server, then restarts the real one.
          for _ in $(seq 1 30); do docker exec pg pg_isready -h 127.0.0.1 -U sirat -d sirat_pages && break; sleep 2; done
          docker exec pg pg_isready -h 127.0.0.1 -U sirat -d sirat_pages || { docker logs pg; exit 1; }
      - name: Migrations, config seed, fixture students and an admin from the create-admin CLI
        run: |
          pnpm --filter @sirat/api exec prisma migrate deploy
          pnpm --filter @sirat/api db:seed
          ALLOW_DEV_FIXTURES=yes-this-is-not-production pnpm --filter @sirat/api db:fixtures:dev
          pnpm --filter @sirat/api build
          printf '%s\n' "$CHECK_ADMIN_PASSWORD" |
            node apps/api/dist/cli/create-admin.js --password-stdin --email "$CHECK_ADMIN_EMAIL" --name "Pages Admin"
      - name: Start the API on :4000
        run: |
          (cd apps/api && setsid node dist/main.js > /tmp/api.log 2>&1 &)
          for _ in $(seq 1 60); do curl -fsS -o /dev/null http://localhost:4000/api/ready && break; sleep 1; done
          curl -fsS http://localhost:4000/api/ready
      - name: Student pages show no scores, times, emails or answer keys (dev server, ?mock=leak, a student session)
        run: |
          setsid pnpm --filter @sirat/web exec next dev -p 3100 > /tmp/next-dev.log 2>&1 &
          DEV=$!
          for _ in $(seq 1 60); do curl -fsS -o /dev/null http://localhost:3100/ && break; sleep 2; done
          pnpm --filter @sirat/web check:leak http://localhost:3100
          kill -- -"$DEV"
      - name: Production build has no mock code; every page shows the shell and a polite state (headless Chrome)
        run: |
          pnpm --filter @sirat/web build
          API_INTERNAL_URL=http://localhost:4000 setsid pnpm --filter @sirat/web exec next start -p 3101 > /tmp/next-start.log 2>&1 &
          echo "PROD_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 60); do curl -fsS -o /dev/null http://localhost:3101/ && break; sleep 1; done
          pnpm --filter @sirat/web check:prod http://localhost:3101
      - name: With the API stopped, pages show the error page and send nobody to /login
        run: |
          pkill -f 'node dist/main.js'
          pnpm --filter @sirat/web check:api-down http://localhost:3101
          kill -- -"$PROD_PID"
      - name: The web server log carries no cookie, token, email or next value
        run: |
          if grep -nE 'sirat_access|sirat_refresh|eyJ[A-Za-z0-9_-]{10,}|next=|@fixtures\.invalid|@ci\.invalid' /tmp/next-start.log; then
            echo "::error::sensitive value in the web server log"; exit 1
          fi
      - name: Server logs on failure
        if: failure()
        run: tail -n 80 /tmp/api.log /tmp/next-dev.log /tmp/next-start.log || true

  database:
    name: Migrations, drift check, DB + Redis integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sirat
          POSTGRES_PASSWORD: ci-only-password # throwaway CI container, not a secret
          POSTGRES_DB: sirat_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sirat -d sirat_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      # Email integration tests deliver to Mailpit (owner: Mailpit until the sending domain is verified).
      mailpit:
        image: axllent/mailpit:v1.32.0
        ports: ['8025:8025']
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://sirat:ci-only-password@localhost:5432/sirat_test
      DIRECT_URL: postgresql://sirat:ci-only-password@localhost:5432/sirat_test
      TEST_DATABASE_URL: postgresql://sirat:ci-only-password@localhost:5432/sirat_test
      SHADOW_DATABASE_URL: postgresql://sirat:ci-only-password@localhost:5432/sirat_shadow
      REDIS_CACHE_URL: redis://localhost:6379
      # The AppModule wiring tests boot the real app, which validates these at startup.
      # JWT_ACCESS_SECRET is generated per run (see the first step): the app refuses weak or placeholder secrets.
      REDIS_QUEUE_URL: redis://localhost:6379
      MAILPIT_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Random signing secret for this run
        run: echo "JWT_ACCESS_SECRET=$(openssl rand -base64 48 | tr -d '\n')" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sirat/shared build
      - run: pnpm db:generate
      - name: Create shadow database for the drift check
        run: PGPASSWORD=ci-only-password psql -h localhost -U sirat -d sirat_test -c "CREATE DATABASE sirat_shadow"
      - name: Migrations match schema.prisma (fails on drift)
        working-directory: apps/api
        run: >-
          pnpm exec prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url "$SHADOW_DATABASE_URL"
          --exit-code
      - name: Apply migrations to a fresh DB, then constraint/seed/rate-limit/app tests
        run: pnpm --filter @sirat/api test:int

  docker:
    name: Nginx config, full stack smoke test, image contents
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DCD: docker compose --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.dev.yml
    steps:
      - uses: actions/checkout@v7
      - name: Compose files are valid (example env plus a random signing secret)
        run: |
          cp .env.example .env
          sed -i "s|^JWT_ACCESS_SECRET=.*|JWT_ACCESS_SECRET=$(openssl rand -hex 32)|" .env
          $DCD config --quiet
      - name: Nginx on the pinned image - both sites pass nginx -t; the TLS site, its headers and its logs
        run: infra/nginx/test/check-sites.sh
      - name: Build and start the whole stack (dev override sizes Postgres for the runner)
        run: $DCD up -d --build
      - name: Every long-running service becomes healthy; migrate exits 0 after the seed
        run: |
          for _ in $(seq 1 60); do
            states=$($DCD ps --format '{{.Service}}={{.Health}}' | grep -v '^migrate=' | sort)
            echo "$states" | grep -q -v '=healthy$' || break
            sleep 5
          done
          echo "$states"
          if echo "$states" | grep -v '=healthy$'; then echo "::error::services not healthy"; exit 1; fi
          code=$(docker inspect -f '{{.State.ExitCode}}' "$($DCD ps -a -q migrate)")
          [ "$code" = 0 ] || { echo "::error::migrate exited $code"; exit 1; }
          $DCD logs migrate | grep -q 'config seed done' || { echo "::error::config seed did not run"; exit 1; }
      - name: Through nginx - readiness (DB + both Redis), liveness and the web app
        run: |
          curl -fsS http://127.0.0.1:8080/api/ready
          curl -fsS http://127.0.0.1:8080/api/health
          curl -fsS -o /dev/null http://127.0.0.1:8080/
      - name: Through nginx - security headers, no-store on /api, and no query string or Referer in nginx's log
        run: |
          page=$(curl -fsS -D - -o /dev/null http://127.0.0.1:8080/)
          for h in X-Content-Type-Options Referrer-Policy Content-Security-Policy-Report-Only; do
            echo "$page" | grep -qi "^$h:" || { echo "::error::$h missing on /"; exit 1; }
          done
          api=$(curl -fsS -D - -o /dev/null http://127.0.0.1:8080/api/health)
          echo "$api" | grep -qi '^cache-control: no-store' || { echo "::error::an API answer without no-store"; exit 1; }
          if echo "$page$api" | grep -qi '^strict-transport-security:'; then echo "::error::HSTS on plain http"; exit 1; fi
          # API answers: helmet sets these, nginx must not add a second copy (infra/nginx/api-headers.conf).
          for h in X-Content-Type-Options Referrer-Policy Content-Security-Policy; do
            [ "$(echo "$api" | grep -ci "^$h:")" = 1 ] || { echo "::error::$h is not exactly once on an API answer"; exit 1; }
          done
          if echo "$api" | grep -qi '^content-security-policy-report-only:'; then echo "::error::the page CSP on an API answer"; exit 1; fi
          q="q$(openssl rand -hex 8)"; r="r$(openssl rand -hex 8)"
          curl -fsS -o /dev/null -H "Referer: http://127.0.0.1:8080/admin/users?q=$r" "http://127.0.0.1:8080/api/health?q=$q"
          sleep 1
          logs=$($DCD logs --no-log-prefix nginx 2>&1)
          echo "$logs" | grep -q '"GET /api/health HTTP' || { echo "::error::the request is not in nginx's log"; exit 1; }
          if echo "$logs" | grep -q -e "$q" -e "$r"; then echo "::error::a query string or Referer reached nginx's log"; exit 1; fi
      - name: Images contain no env files, keys, dumps, old project, tests or dev fixtures
        # Scan the app roots as root (non-root find exits 1 on unreadable dirs and `bash -e` aborts the step).
        # node_modules is skipped: some packages ship test certificates.
        run: |
          for img in sirat-api sirat-migrate sirat-web; do
            found=$(docker run --rm --user 0 --entrypoint sh "$img" -c '
              for d in /repo /app; do
                [ -d "$d" ] || continue
                find "$d" -path "*/node_modules" -prune -o \( -name ".env" -o -name ".env.*" -o -name ".envrc" \
                  -o -name "*.pem" -o -name "*.key" -o -name "*.dump" -o -name "*.age" -o -name "zero-olympiad-*" \
                  -o -path "*/prisma/fixtures" -o -path "*/apps/api/test" -o -path "*/infra" -o -path "*/scripts" \
                  -o -path "*/backups" -o -path "*/nginx/certs" \) -print
              done')
            if [ -n "$found" ]; then echo "::error::$img contains forbidden files:"; echo "$found"; exit 1; fi
            echo "$img clean"
          done
      - name: The web can store regenerated pages (no EACCES after an ISR revalidation)
        # The public pages revalidate every 60 s. The first request after that regenerates the page, and Next writes it
        # to .next/server/route-cache and its fetch results to .next/cache, as the runtime user (apps/web/Dockerfile).
        run: |
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          sleep 65
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          curl -fsS -o /dev/null http://127.0.0.1:8080/bn
          sleep 5
          if $DCD logs web 2>&1 | grep -E 'EACCES|Failed to update prerender cache'; then
            echo "::error::the web cannot write its cache"; exit 1
          fi
      - name: Backups are encrypted, checked and uploaded; a killed dump, a bad remote or a shrunken dump fails (L6)
        # Its own compose project (sirat-backup-test), a throwaway age key and an rclone local remote; see the script.
        run: bash scripts/test/run-backup-test.sh
      - name: Server checks - monitor.sh on faked commands (L11)
        run: bash scripts/test/run-monitor-test.sh
      - name: Server checks - a monitor.sh dry run against this stack (ops-check runs in the api container, L11)
        # No backup exists here, so backup_age is critical; the step only proves that the facts are collected and that
        # ops-check runs (a failure to run would show as critical=monitor). Nothing is raised or pinged.
        run: |
          cfg=$(mktemp)
          {
            echo 'MONITOR_PROJECT=sirat'
            echo 'MONITOR_COMPOSE_FILES=infra/docker-compose.yml infra/docker-compose.dev.yml'
            echo 'MONITOR_COMPOSE_ENV_FILES=.env'
            echo "MONITOR_STATE_FILE=$cfg.state"
            echo "MONITOR_DEPLOY_LOCK=$cfg.lock"
          } > "$cfg"
          chmod 600 "$cfg"
          out=$(SIRAT_MONITOR_ENV="$cfg" bash scripts/monitor.sh --dry-run)
          echo "$out"
          echo "$out" | grep -q '^host facts: {' || { echo "::error::no host facts"; exit 1; }
          echo "$out" | grep -q '(dry run)$' || { echo "::error::no summary"; exit 1; }
          if echo "$out" | grep -q 'critical=monitor'; then echo "::error::ops-check did not run"; exit 1; fi
      - name: Server checks - the compiled ops-alert runs in the api image (its main(), not only its functions)
        # ops-check's compiled main() ran in the dry run above. No recipient here, so nothing is emailed.
        run: |
          out=$($DCD exec -T api node dist/cli/ops-alert.js --kind ops.alert_test --meta ci=1)
          echo "$out"
          echo "$out" | grep -q '^ops-alert: ops.alert_test recorded$' || { echo "::error::ops-alert did not run"; exit 1; }
      - name: Logs on failure
        if: failure()
        run: $DCD ps -a; $DCD logs --tail=200
      - name: Tear down
        if: always()
        run: $DCD down -v
