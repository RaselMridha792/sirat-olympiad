# CI checks (RULEBOOK §13, §15, §18). ADVISORY on main: a private repo on GitHub Free cannot enforce required
# checks or branch protection (docs/DECISIONS.md), so deploy only a commit whose CI run is green (RUNBOOK §2).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Every main commit gets a finished run (the deploy gate checks the exact commit); PR runs can be superseded.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Format, typecheck, lint, unit tests, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"; v6 requires pnpm 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Shell scripts are executable in git (Windows commits drop the bit)
        run: git ls-files -s -- '*.sh' | awk '$1 != "100755" { print; bad = 1 } END { exit bad }'
      - name: No pipe into an early-exiting reader under pipefail (SIGPIPE made backup.sh --verify fail at random)
        run: bash scripts/test/check-early-exit-pipes.sh
      - name: shellcheck on every shell script (warnings and errors)
        run: shellcheck -S warning $(git ls-files '*.sh')
      - name: load-staging.sh on faked commands - the firewall window opens only for the listed addresses and closes on a signal, an error and its timer; a dry run changes nothing (E6 kit)
        run: bash scripts/test/load-staging.test.sh
      - name: loadtest-generators-left.sh - trusted load-test generators as minutes to the earliest expiry, negative past it or unreadable (A2's L14 files)
        run: bash scripts/test/loadtest-generators-left.test.sh
      - run: pnpm format:check
      - run: pnpm --filter @sirat/shared build
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Dependency audit (all deps, high and above; the migrate image runs dev dependencies)
        run: pnpm audit --audit-level high

  web-pages:
    # Render-level checks of every dashboard page with REAL sessions (apps/web/scripts/check-pages.mjs,
    # docs/07-UI-MIGRATION.md): the API runs here on :4000 with its own Postgres and Redis; a fixture student and an
    # admin made with the create-admin CLI log in through it. No session stub.
    name: Dashboard pages (real sessions, no student data leaks, polite states, API down)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://sirat:ci-only-password@localhost:5432/sirat_pages
      DIRECT_URL: postgresql://sirat:ci-only-password@localhost:5432/sirat_pages
      REDIS_CACHE_URL: redis://localhost:6379/0
      REDIS_QUEUE_URL: redis://localhost:6379/1
      COOKIE_SECURE: 'false' # plain http on localhost
      CHECK_API_URL: http://localhost:4000
      CHECK_STUDENT_EMAIL: student1@fixtures.invalid
      CHECK_ADMIN_EMAIL: pages-admin@ci.invalid
      CHECK_AMBASSADOR_EMAIL: student2@fixtures.invalid # approved by the admin through the API (step below)
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sirat/shared build
      - run: pnpm db:generate
      - name: Throwaway secrets for this run (masked)
        run: |
          for name in JWT_ACCESS_SECRET FIXTURE_PASSWORD CHECK_ADMIN_PASSWORD; do
            value=$(openssl rand -hex 24)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
            # An if, not `[ ... ] && ...`: that list ends the loop, and so the step, with status 1.
            if [ "$name" = FIXTURE_PASSWORD ]; then
              echo "CHECK_STUDENT_PASSWORD=$value" >> "$GITHUB_ENV"
              echo "CHECK_AMBASSADOR_PASSWORD=$value" >> "$GITHUB_ENV"
            fi
          done
      - name: Postgres with the dev/test marker (fixtures refuse a server without it; services cannot pass -c)
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_USER=sirat -e POSTGRES_PASSWORD=ci-only-password \
            -e POSTGRES_DB=sirat_pages postgres:17-alpine -c sirat.environment=test
          # Over TCP: on first start the image runs a socket-only temporary server, then restarts the real one.
          for _ in $(seq 1 30); do docker exec pg pg_isready -h 127.0.0.1 -U sirat -d sirat_pages && break; sleep 2; done
          docker exec pg pg_isready -h 127.0.0.1 -U sirat -d sirat_pages || { docker logs pg; exit 1; }
      - name: Migrations, config seed, fixture students and an admin from the create-admin CLI
        run: |
          pnpm --filter @sirat/api exec prisma migrate deploy
          pnpm --filter @sirat/api db:seed
          ALLOW_DEV_FIXTURES=yes-this-is-not-production pnpm --filter @sirat/api db:fixtures:dev
          pnpm --filter @sirat/api build
          printf '%s\n' "$CHECK_ADMIN_PASSWORD" |
            node apps/api/dist/cli/create-admin.js --password-stdin --email "$CHECK_ADMIN_EMAIL" --name "Pages Admin"
      - name: Start the API on :4000
        run: |
          (cd apps/api && setsid node dist/main.js > /tmp/api.log 2>&1 &)
          for _ in $(seq 1 60); do curl -fsS -o /dev/null http://localhost:4000/api/ready && break; sleep 1; done
          curl -fsS http://localhost:4000/api/ready
      - name: The admin approves a fixture student as an ambassador (the real endpoint, this throwaway DB only)
        run: |
          api=http://localhost:4000/api
          jq -n --arg email "$CHECK_ADMIN_EMAIL" --arg password "$CHECK_ADMIN_PASSWORD" '{email: $email, password: $password}' |
            curl -fsS -o /dev/null -c /tmp/admin.jar -H 'content-type: application/json' -H 'x-requested-with: sirat-web' \
              --data-binary @- "$api/auth/login" || { echo "::error::admin login for the ambassador approval failed"; exit 1; }
          id=$(curl -fsS -b /tmp/admin.jar "$api/admin/users?q=$CHECK_AMBASSADOR_EMAIL" |
            jq -r --arg email "$CHECK_AMBASSADOR_EMAIL" '.items[] | select(.email == $email) | .id') ||
            { echo "::error::the admin students list did not answer"; exit 1; }
          if [ -z "$id" ]; then echo "::error::fixture student $CHECK_AMBASSADOR_EMAIL not found in the admin list"; exit 1; fi
          status=$(curl -sS -o /tmp/approve.json -w '%{http_code}' -b /tmp/admin.jar -H 'content-type: application/json' \
            -H 'x-requested-with: sirat-web' --data '{"reason":"CI page check"}' "$api/admin/ambassadors/$id/approve")
          rm -f /tmp/admin.jar
          if [ "$status" != 200 ]; then
            echo "::error::approving $CHECK_AMBASSADOR_EMAIL as an ambassador answered HTTP $status: $(jq -c '{code, details}' /tmp/approve.json)"
            exit 1
          fi
      - name: Student pages show no scores, times, emails or answer keys (dev server, ?mock=leak, a student session)
        run: |
          setsid pnpm --filter @sirat/web exec next dev -p 3100 > /tmp/next-dev.log 2>&1 &
          DEV=$!
          for _ in $(seq 1 60); do curl -fsS -o /dev/null http://localhost:3100/ && break; sleep 2; done
          pnpm --filter @sirat/web check:leak http://localhost:3100
          kill -- -"$DEV"
      - name: Production build has no mock code; every page shows the shell and a polite state (headless Chrome)
        run: |
          pnpm --filter @sirat/web build
          API_INTERNAL_URL=http://localhost:4000 setsid pnpm --filter @sirat/web exec next start -p 3101 > /tmp/next-start.log 2>&1 &
          echo "PROD_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 60); do curl -fsS -o /dev/null http://localhost:3101/ && break; sleep 1; done
          pnpm --filter @sirat/web check:prod http://localhost:3101
      - name: With the API stopped, pages show the error page and send nobody to /login
        run: |
          pkill -f 'node dist/main.js'
          pnpm --filter @sirat/web check:api-down http://localhost:3101
          kill -- -"$PROD_PID"
      - name: The web server log carries no cookie, token, email or next value
        run: |
          if grep -nE 'sirat_access|sirat_refresh|eyJ[A-Za-z0-9_-]{10,}|next=|@fixtures\.invalid|@ci\.invalid' /tmp/next-start.log; then
            echo "::error::sensitive value in the web server log"; exit 1
          fi
      - name: Server logs on failure
        if: failure()
        run: tail -n 80 /tmp/api.log /tmp/next-dev.log /tmp/next-start.log || true

  database:
    name: Migrations, drift check, DB + Redis integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sirat
          POSTGRES_PASSWORD: ci-only-password # throwaway CI container, not a secret
          POSTGRES_DB: sirat_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sirat -d sirat_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      # Email integration tests deliver to Mailpit (owner: Mailpit until the sending domain is verified).
      mailpit:
        image: axllent/mailpit:v1.32.0
        ports: ['8025:8025']
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://sirat:ci-only-password@localhost:5432/sirat_test
      DIRECT_URL: postgresql://sirat:ci-only-password@localhost:5432/sirat_test
      TEST_DATABASE_URL: postgresql://sirat:ci-only-password@localhost:5432/sirat_test
      SHADOW_DATABASE_URL: postgresql://sirat:ci-only-password@localhost:5432/sirat_shadow
      REDIS_CACHE_URL: redis://localhost:6379
      # The AppModule wiring tests boot the real app, which validates these at startup.
      # JWT_ACCESS_SECRET is generated per run (see the first step): the app refuses weak or placeholder secrets.
      # No TOTP_ENCRYPTION_KEY: admin 2FA is off for the suites, so their admin sessions open the admin routes; the 2FA
      # suites (auth-two-factor*.int-spec.ts) set their own throwaway key.
      REDIS_QUEUE_URL: redis://localhost:6379
      MAILPIT_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Random signing secret for this run
        run: echo "JWT_ACCESS_SECRET=$(openssl rand -base64 48 | tr -d '\n')" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sirat/shared build
      - run: pnpm db:generate
      - name: Create shadow database for the drift check
        run: PGPASSWORD=ci-only-password psql -h localhost -U sirat -d sirat_test -c "CREATE DATABASE sirat_shadow"
      - name: Migrations match schema.prisma (fails on drift)
        working-directory: apps/api
        run: >-
          pnpm exec prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url "$SHADOW_DATABASE_URL"
          --exit-code
      # The migrate job's own steps: the migration creates sirat_app, then runtime-role.ts gives it a login with a
      # throwaway password. The app under test then connects as sirat_app, as production will after L8 (test/load-env.ts).
      - name: The runtime role sirat_app, as the migrate job sets it up
        working-directory: apps/api
        env:
          PGPASSWORD: ci-only-password # throwaway CI container, not a secret
        run: |
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          echo "TEST_APP_DATABASE_URL=postgresql://sirat_app:${password}@localhost:5432/sirat_test" >> "$GITHUB_ENV"
          pnpm exec prisma migrate deploy
          # The migrations alone protect the append-only tables and the migration log, and allow no temporary tables
          # (runtime-role.ts re-asserts the same, so the tests below cannot tell the two apart).
          wrong=$(psql -h localhost -U sirat -d sirat_test -tAc "
            SELECT c.relname FROM pg_trigger t JOIN pg_class c ON c.oid = t.tgrelid JOIN pg_proc p ON p.oid = t.tgfoid
            WHERE NOT t.tgisinternal AND p.proname LIKE '%\_append\_only'
              AND (has_table_privilege('sirat_app', c.oid, 'UPDATE') OR has_table_privilege('sirat_app', c.oid, 'DELETE'))
            UNION SELECT '_prisma_migrations' WHERE has_table_privilege('sirat_app', 'public._prisma_migrations', 'SELECT')
            UNION SELECT 'TEMPORARY for PUBLIC' WHERE has_database_privilege('public', current_database(), 'TEMPORARY')")
          [ -z "$wrong" ] || { echo "::error::the migrations leave too many rights: $wrong"; exit 1; }
          # Undo one thing per repair step: the tests below fail if runtime-role.ts skips one.
          psql -h localhost -U sirat -d sirat_test -q -c "GRANT UPDATE, DELETE ON audit_logs TO sirat_app" \
            -c "GRANT TEMPORARY ON DATABASE sirat_test TO PUBLIC" -c "ALTER DATABASE sirat_test RESET lock_timeout" \
            -c "ALTER ROLE sirat_app SET statement_timeout = 0"
          out=$(POSTGRES_APP_PASSWORD="$password" pnpm exec tsx prisma/runtime-role.ts 2>&1)
          echo "$out"
          grep -qF 'runtime role ready: sirat_app (login and password set)' <<<"$out"
          grep -qF 'runtime role: cleared 1 role-level setting(s) of sirat_app' <<<"$out"
      - name: Apply migrations to a fresh DB, then constraint/seed/rate-limit/app tests
        run: pnpm --filter @sirat/api test:int

  docker:
    name: Nginx config, full stack smoke test, image contents
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DCD: docker compose --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.dev.yml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Compose files are valid (example env plus a random signing secret)
        run: |
          cp .env.example .env
          sed -i "s|^JWT_ACCESS_SECRET=.*|JWT_ACCESS_SECRET=$(openssl rand -hex 32)|" .env
          sed -i "s|^POSTGRES_APP_PASSWORD=.*|POSTGRES_APP_PASSWORD=$(openssl rand -hex 32)|" .env
          # The api runs with NODE_ENV=production, which requires the admin 2FA key (commented out in the example).
          printf 'TOTP_ENCRYPTION_KEY=%s\n' "$(openssl rand -base64 32)" >> .env
          $DCD config --quiet
      - name: Nginx on the pinned image - both sites pass nginx -t; the TLS site, its headers and its logs
        run: infra/nginx/test/check-sites.sh
      - name: Nginx real IPs (L4) - restored from trusted peers only, one bucket per IPv4 address or IPv6 /64, the load-test generators
        run: infra/nginx/test/check-real-ips.sh
      - name: Build and start the whole stack (dev override sizes Postgres for the runner)
        run: $DCD up -d --build
      - name: Every long-running service becomes healthy; migrate exits 0 after the seed
        run: |
          for _ in $(seq 1 60); do
            states=$($DCD ps --format '{{.Service}}={{.Health}}' | grep -v '^migrate=' | sort)
            echo "$states" | grep -q -v '=healthy$' || break
            sleep 5
          done
          echo "$states"
          if echo "$states" | grep -v '=healthy$'; then echo "::error::services not healthy"; exit 1; fi
          code=$(docker inspect -f '{{.State.ExitCode}}' "$($DCD ps -a -q migrate)")
          [ "$code" = 0 ] || { echo "::error::migrate exited $code"; exit 1; }
          $DCD logs migrate | grep -q 'config seed done' || { echo "::error::config seed did not run"; exit 1; }
          $DCD logs migrate | grep -q 'runtime role ready: sirat_app (login and password set)' ||
            { echo "::error::the migrate job did not set up the runtime role"; exit 1; }
      - name: Through nginx - readiness (DB + both Redis), liveness and the web app
        run: |
          curl -fsS http://127.0.0.1:8080/api/ready
          curl -fsS http://127.0.0.1:8080/api/health
          curl -fsS -o /dev/null http://127.0.0.1:8080/
      - name: Through nginx - security headers, no-store on /api, and no query string or Referer in nginx's log
        run: |
          page=$(curl -fsS -D - -o /dev/null http://127.0.0.1:8080/)
          for h in X-Content-Type-Options Referrer-Policy Content-Security-Policy-Report-Only Permissions-Policy; do
            echo "$page" | grep -qi "^$h:" || { echo "::error::$h missing on /"; exit 1; }
          done
          api=$(curl -fsS -D - -o /dev/null http://127.0.0.1:8080/api/health)
          echo "$api" | grep -qi '^cache-control: no-store' || { echo "::error::an API answer without no-store"; exit 1; }
          if echo "$page$api" | grep -qi '^strict-transport-security:'; then echo "::error::HSTS on plain http"; exit 1; fi
          # API answers: helmet sets these, nginx must not add a second copy (infra/nginx/api-headers.conf).
          for h in X-Content-Type-Options Referrer-Policy Content-Security-Policy; do
            [ "$(echo "$api" | grep -ci "^$h:")" = 1 ] || { echo "::error::$h is not exactly once on an API answer"; exit 1; }
          done
          if echo "$api" | grep -qi '^content-security-policy-report-only:'; then echo "::error::the page CSP on an API answer"; exit 1; fi
          q="q$(openssl rand -hex 8)"; r="r$(openssl rand -hex 8)"
          curl -fsS -o /dev/null -H "Referer: http://127.0.0.1:8080/admin/users?q=$r" "http://127.0.0.1:8080/api/health?q=$q"
          sleep 1
          logs=$($DCD logs --no-log-prefix nginx 2>&1)
          echo "$logs" | grep -q '"GET /api/health HTTP' || { echo "::error::the request is not in nginx's log"; exit 1; }
          if echo "$logs" | grep -q -e "$q" -e "$r"; then echo "::error::a query string or Referer reached nginx's log"; exit 1; fi
      - name: Admin two-factor login in Chrome through nginx (e2e:2fa) - enrolment, the code step, a recovery code, a refresh, turning it off, the page CSP
        # A throwaway admin from the CLI, as on the VPS (--password-stdin: no terminal here). The script has no
        # dependencies; its password and the authenticator secret never reach the log (RUNBOOK section 22).
        run: |
          pw=$(openssl rand -hex 16)
          echo "::add-mask::$pw"
          printf '%s\n' "$pw" | $DCD run --rm --no-deps -T api node dist/cli/create-admin.js --password-stdin \
            --email e2e-2fa@ci.invalid --name "CI Two Factor"
          E2E_2FA_EMAIL=e2e-2fa@ci.invalid E2E_2FA_PASSWORD="$pw" node apps/web/scripts/e2e-2fa.mjs http://localhost:8080
      - name: Images contain no env files, keys, dumps, old project, tests or dev fixtures
        # Scan the app roots as root (non-root find exits 1 on unreadable dirs and `bash -e` aborts the step).
        # node_modules is skipped: some packages ship test certificates.
        run: |
          for img in sirat-api sirat-migrate sirat-web; do
            found=$(docker run --rm --user 0 --entrypoint sh "$img" -c '
              for d in /repo /app; do
                [ -d "$d" ] || continue
                find "$d" -path "*/node_modules" -prune -o \( -name ".env" -o -name ".env.*" -o -name ".envrc" \
                  -o -name "*.pem" -o -name "*.key" -o -name "*.dump" -o -name "*.age" -o -name "zero-olympiad-*" \
                  -o -path "*/prisma/fixtures" -o -path "*/apps/api/test" -o -path "*/infra" -o -path "*/scripts" \
                  -o -path "*/backups" -o -path "*/nginx/certs" \) -print
              done')
            if [ -n "$found" ]; then echo "::error::$img contains forbidden files:"; echo "$found"; exit 1; fi
            echo "$img clean"
          done
      - name: The web can store regenerated pages (no EACCES after an ISR revalidation)
        # The public pages revalidate every 60 s. The first request after that regenerates the page, and Next writes it
        # to .next/server/route-cache and its fetch results to .next/cache, as the runtime user (apps/web/Dockerfile).
        run: |
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          sleep 65
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          curl -fsS -o /dev/null http://127.0.0.1:8080/bn
          sleep 5
          if $DCD logs web 2>&1 | grep -E 'EACCES|Failed to update prerender cache'; then
            echo "::error::the web cannot write its cache"; exit 1
          fi
      - name: Maintenance switch (L5) - nginx in its own containers with fake upstreams; pages, API, IPN, callback, deploy gap
        run: infra/nginx/test/check-maintenance.sh
      - name: Maintenance switch on the stack - the page and MAINTENANCE through nginx; the IPN and callback reach the API
        # Through the published port (the plain site). The internal listener keeps serving and no data service restarts.
        run: |
          data() { docker inspect -f '{{.Name}} {{.State.StartedAt}}' $($DCD ps -q postgres pgbouncer redis-cache redis-queue) | sort; }
          before=$(data)
          scripts/maintenance.sh on
          code=$(curl -s -o /tmp/page.html -w '%{http_code}' http://127.0.0.1:8080/)
          [ "$code" = 503 ] && grep -q 'data-sirat-page="maintenance"' /tmp/page.html || { echo "::error::no maintenance page ($code)"; exit 1; }
          ready=$(curl -s -w ' %{http_code}' http://127.0.0.1:8080/api/ready)
          echo "$ready" | grep -q '"code":"MAINTENANCE".* 503$' || { echo "::error::/api/ready while on: $ready"; exit 1; }
          [ "$(curl -s http://127.0.0.1:8080/healthz)" = ok ] || { echo "::error::/healthz while on"; exit 1; }
          ipn=$(curl -s -w ' %{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8080/api/payments/paystation/ipn)
          [ "$ipn" = '{"received":true} 200' ] || { echo "::error::the IPN did not reach the API: $ipn"; exit 1; }
          callback=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://127.0.0.1:8080/api/payments/paystation/callback/not-an-invoice)
          echo "$callback" | grep -q '^303 .*/register/result$' || { echo "::error::the callback did not reach the API: $callback"; exit 1; }
          inner=$($DCD exec -T nginx wget -qO- http://127.0.0.1:8081/api/ready)
          [ "$inner" = '{"status":"ready"}' ] || { echo "::error::the internal listener while on: $inner"; exit 1; }
          scripts/maintenance.sh off
          curl -fsS http://127.0.0.1:8080/api/ready
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          [ "$(data)" = "$before" ] || { echo "::error::a data service restarted"; exit 1; }
      - name: deploy.sh refuses this stack (Postgres carries the development marker) and a second first start (L9)
        # The full deploy, rollback and failure paths run in the rehearsal (scripts/test/run-deploy-rehearsal.sh).
        run: |
          printf 'DEPLOY_PROJECT=sirat\nDEPLOY_COMPOSE_FILES=infra/docker-compose.yml infra/docker-compose.dev.yml\nDEPLOY_RELEASE_DIR=%s\nDEPLOY_MIN_FREE_GB=1\n' \
            "$RUNNER_TEMP/sirat-release" > .env.deploy
          chmod 600 .env.deploy .env
          s=0; out=$(scripts/deploy.sh "$GITHUB_SHA" 2>&1) || s=$?
          echo "$out"
          [ "$s" -ne 0 ] && grep -q 'development marker' <<< "$out" || { echo "::error::deploy.sh did not refuse a dev stack"; exit 1; }
          s=0; out=$(scripts/deploy.sh --first 2>&1) || s=$?
          echo "$out"
          [ "$s" -ne 0 ] && grep -q 'already exists' <<< "$out" || { echo "::error::deploy.sh --first did not refuse a host with data containers"; exit 1; }
          rm -f .env.deploy
      - name: prelaunch-check.sh --local on this development stack - what must pass, what must fail, and no value printed (L12)
        run: |
          printf 'DEPLOY_PROJECT=sirat\nDEPLOY_COMPOSE_FILES=infra/docker-compose.yml infra/docker-compose.dev.yml\nDEPLOY_RELEASE_DIR=%s\n' \
            "$RUNNER_TEMP/sirat-release" > .env.deploy
          chmod 600 .env.deploy .env
          out=$(scripts/prelaunch-check.sh --local 2>&1 || true)
          echo "$out"
          # Once more with a trusted load-test generators file left behind (expired): that line must fail. nginx never
          # reloads in this step, so the file reaches no request.
          printf '# expires 2000-01-01T00:00:00Z\nset_real_ip_from 203.0.113.5;\n' > infra/nginx/loadtest-realip.ci-test.conf
          gen=$(scripts/prelaunch-check.sh --local 2>&1 || true)
          rm -f infra/nginx/loadtest-realip.ci-test.conf .env.deploy
          grep -qxF 'FAIL    no trusted load-test generators (scripts/loadtest-generators.sh off)' <<< "$gen" ||
            { echo "::error::prelaunch-check passed with a trusted-generators file"; exit 1; }
          # The word is padded to 8 columns (N/A takes 5 spaces). The disk line depends on the runner, so it is not asserted.
          bad=$(grep -vE '^(PASS|FAIL|N/A|MANUAL) +[a-zA-Z.]|^prelaunch-check: ' <<< "$out" || true)
          [ -z "$bad" ] || { echo "::error::a line that is not PASS, FAIL, N/A or MANUAL"; exit 1; }
          for v in $(grep -E '^(JWT_ACCESS_SECRET|POSTGRES_PASSWORD|TOTP_ENCRYPTION_KEY)=' .env | cut -d= -f2-); do
            ! grep -qF -- "$v" <<< "$out" || { echo "::error::a secret value reached the output"; exit 1; }
          done
          for line in 'PASS    migrations are up to date' 'PASS    the worker is healthy' 'PASS    no published exam yet' \
            'PASS    the registration fee is 400 BDT (40000 paisa)' 'PASS    registration_open is false' 'PASS    the page CSP is sent' \
            'PASS    TOTP_ENCRYPTION_KEY is set: 32 random bytes, base64 or 64 hex (admin 2FA)' \
            'PASS    every API logs two-factor=on (admin 2FA enforced)' \
            'FAIL    no development marker on Postgres' 'FAIL    no Mailpit in the project' 'FAIL    APP_URL is https' \
            'N/A     the newest off-server backup is under 26 h old (on the VPS only)' \
            'PASS    no trusted load-test generators (scripts/loadtest-generators.sh off)'; do
            grep -qxF -- "$line" <<< "$out" || { echo "::error::expected: $line"; exit 1; }
          done
      - name: bootstrap.sh in an Ubuntu 24.04 container - dry run, no lockout, the setup, idempotent (L12)
        run: bash scripts/test/run-bootstrap-test.sh
      - name: Backups are encrypted, checked and uploaded; a killed dump, a bad remote or a shrunken dump fails (L6)
        # Its own compose project (sirat-backup-test), a throwaway age key and an rclone local remote; see the script.
        run: bash scripts/test/run-backup-test.sh
      - name: Restore round trip into a fresh cluster (L7) - A dumped, B after; A logs in, B does not; then the beside mode
        # Its own projects (sirat-drill-src, sirat-drill) on the images the stack step built from this commit (:latest),
        # ports on 127.0.0.1 only; the drill's api and worker read only its throwaway settings.
        run: bash scripts/test/run-restore-roundtrip.sh
      - name: Server checks - monitor.sh on faked commands (L11)
        run: bash scripts/test/run-monitor-test.sh
      - name: Server checks - a monitor.sh dry run against this stack (ops-check runs in the api container, L11)
        # No backup exists here, so backup_age is critical; the step only proves that the facts are collected and that
        # ops-check runs (a failure to run would show as critical=monitor). Nothing is raised or pinged.
        run: |
          cfg=$(mktemp)
          {
            echo 'MONITOR_PROJECT=sirat'
            echo 'MONITOR_COMPOSE_FILES=infra/docker-compose.yml infra/docker-compose.dev.yml'
            echo 'MONITOR_COMPOSE_ENV_FILES=.env'
            echo "MONITOR_STATE_FILE=$cfg.state"
            echo "MONITOR_DEPLOY_LOCK=$cfg.lock"
          } > "$cfg"
          chmod 600 "$cfg"
          out=$(SIRAT_MONITOR_ENV="$cfg" bash scripts/monitor.sh --dry-run)
          echo "$out"
          echo "$out" | grep -q '^host facts: {' || { echo "::error::no host facts"; exit 1; }
          echo "$out" | grep -q '(dry run)$' || { echo "::error::no summary"; exit 1; }
          if echo "$out" | grep -q 'critical=monitor'; then echo "::error::ops-check did not run"; exit 1; fi
      - name: Server checks - the compiled ops-alert runs in the api image (its main(), not only its functions)
        # ops-check's compiled main() ran in the dry run above. No recipient here, so nothing is emailed.
        run: |
          out=$($DCD exec -T api node dist/cli/ops-alert.js --kind ops.alert_test --meta ci=1)
          echo "$out"
          echo "$out" | grep -q '^ops-alert: ops.alert_test recorded$' || { echo "::error::ops-alert did not run"; exit 1; }
      - name: Exam smoke - 20 students take a 1-minute exam on these images; counted outcomes only, never a timing (E6)
        # Its own compose project (sirat-exam-load) on the :latest images built above, nothing published, removed at the
        # end. It fails on an error, a lost submission, an unscored attempt or a leaver the sweep missed (loadtests/README.md).
        run: |
          SMOKE=1 NO_BUILD=1 LOAD_TAG=latest USERS=20 DURATION=1 RAMP=5 CHECKPOINT_MIN=21 CHECKPOINT_MAX=25 LEAVE_SHARE=0.15 \
            LOAD_OUT="$RUNNER_TEMP/exam-smoke" bash loadtests/exam-local.sh steady
      - name: The fake PayStation for load and staging stacks (dev/test only) - its own image, internal only, and the api runs on it
        # Last on purpose: it restarts api and worker with PAYSTATION_ENV=fake (infra/fake-paystation.compose.yml).
        run: |
          FAKE="$DCD -f infra/fake-paystation.compose.yml"
          $FAKE up -d --build --no-deps fake-paystation api worker
          for _ in $(seq 1 60); do
            states=$($FAKE ps --format '{{.Service}}={{.Health}}' fake-paystation api worker | sort -u)
            grep -q -v '=healthy$' <<< "$states" || break
            sleep 5
          done
          echo "$states"
          if grep -v '=healthy$' <<< "$states"; then
            $FAKE logs --tail=100 fake-paystation api; echo "::error::fake-paystation, api or worker not healthy"; exit 1
          fi
          # Internal only: no published port (`compose port` prints ":0" and exits 0 then, so read the bindings).
          binds=$(docker inspect -f '{{json .HostConfig.PortBindings}}' "$($FAKE ps -q fake-paystation)")
          if [ "$binds" != "{}" ] && [ "$binds" != "null" ]; then echo "::error::the fake publishes a port: $binds"; exit 1; fi
          # It answers inside the project, by its service name.
          $FAKE exec -T api node -e "fetch('http://fake-paystation:18090/__fake/health').then((r) => r.json()).then((b) => process.exit(b.ok ? 0 : 1), () => process.exit(1))"
          # The api accepted PAYSTATION_ENV=fake: payments are configured, so the info shows the fee (it caches 30 s).
          # `|| true`: the step runs under bash -e, and a 502 while nginx still holds the recreated api's old address
          # (up to 10 s) would otherwise end the step instead of retrying.
          for _ in $(seq 1 12); do
            info=$(curl -fsS http://127.0.0.1:8080/api/registrations/info || true)
            grep -q '"fee":{"amountMinor":' <<< "$info" && break
            sleep 5
          done
          grep -q '"fee":{"amountMinor":' <<< "$info" || { echo "::error::the api is not on the fake PayStation: $info"; exit 1; }
      - name: Logs on failure
        if: failure()
        run: $DCD ps -a; $DCD logs --tail=200
      - name: Tear down
        if: always()
        run: $DCD -f infra/fake-paystation.compose.yml down -v --remove-orphans
